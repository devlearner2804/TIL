<!--
태그 정리

<!DOCTYPE html>
- HTML5 문서라는 것을 브라우저에게 알려주는 선언입니다.

<html>
- 웹 페이지 전체를 감싸는 태그입니다.
- lang="ko"는 한국어 문서라는 뜻입니다.

<head>
- 화면에 직접 보이지 않는 문서 정보가 들어가는 구역입니다.
- meta, title, style 같은 태그가 들어갑니다.

<meta>
- 문서 정보를 설정하는 태그입니다.
- charset="UTF-8"은 한글이 깨지지 않게 합니다.
- viewport는 화면 크기에 맞게 보이도록 합니다.

<title>
- 브라우저 탭에 보이는 제목을 정하는 태그입니다.

<body>
- 화면에 실제로 보이는 내용을 넣는 태그입니다.

<div>
- 여러 태그를 하나의 구역으로 묶는 태그입니다.
- class나 id를 붙여서 CSS로 모양을 꾸밀 수 있습니다.

<header>
- 페이지의 위쪽 머리말 구역을 나타내는 시멘틱 태그입니다.

<nav>
- 메뉴나 페이지 이동 링크를 넣는 시멘틱 태그입니다.

<ul>
- 순서가 없는 목록을 만드는 태그입니다.
- 메뉴바를 만들 때 사용했습니다.

<li>
- ul 안에 들어가는 목록의 한 항목입니다.

<span>
- 짧은 글자나 문장 일부를 따로 묶을 때 쓰는 태그입니다.
- LOGO와 HTML5/CSS3 애니메이션 글자에 사용했습니다.

<a>
- 클릭할 수 있는 링크 태그입니다.
- onclick을 넣어서 메인, 프로젝트, 기술 페이지를 넘기게 했습니다.

<section>
- 페이지의 본문 내용을 나누는 시멘틱 태그입니다.

<h2>
- 페이지 제목을 나타내는 제목 태그입니다.

<h3>
- 프로젝트 이름 같은 작은 제목을 나타내는 태그입니다.

<img>
- 이미지를 넣는 태그입니다.
- src는 이미지 파일 경로, alt는 이미지 설명입니다.

<p>
- 문단을 작성하는 태그입니다.

<footer>
- 페이지 아래쪽 꼬리말 구역을 나타내는 시멘틱 태그입니다.

<script>
- 자바스크립트를 작성하는 태그입니다.
- 수행3.html에서는 메뉴 클릭으로 페이지를 바꾸는 기능에 사용했습니다.

<style>
- CSS를 작성하는 태그입니다.
- WAP 파일에서는 스타일을 구역별 파일로 나눠 정리했습니다.
-->

<!--
스타일 선택자 정리

body
- 전체 페이지 화면에 적용되는 스타일입니다.

.page
- 메인 페이지, 프로젝트 목록, 기술 목록 한 장 한 장에 적용되는 스타일입니다.

.active
- 현재 보이는 페이지만 display: block으로 보여주는 클래스입니다.

header
- 메뉴바가 들어가는 검은색 상단 영역입니다.

nav ul
- 메뉴 목록 전체의 여백과 정렬을 정합니다.

nav li
- 메뉴 한 칸 한 칸의 배치를 정합니다.

nav a
- 메뉴 링크 글자 스타일을 정합니다.

nav a:hover
- 마우스를 메뉴 위에 올렸을 때 글자색이 바뀌게 합니다.

.logo
- LOGO 글자 스타일입니다.

section
- 본문 구역의 너비와 위치를 정합니다.

h2
- 페이지 제목의 여백, 크기, 굵기를 정합니다.

h3
- 프로젝트 이름의 글자색을 정합니다.

.main-intro
- 메인 페이지의 자기소개 칸입니다.

.main-right
- 증명사진과 경력사항을 묶는 오른쪽 구역입니다.

.photo-box
- 증명사진 칸입니다.
- 테두리와 그림자가 적용되어 있습니다.

.photo-box img
- 증명사진 이미지가 칸 안에 맞게 들어가도록 합니다.

.career-box
- 경력사항 칸입니다.
- 증명사진 아래쪽에 오도록 배치했습니다.

.project-wrap
- 프로젝트 하나를 묶는 구역입니다.

.project-photo
- 프로젝트 실행 사진 칸입니다.

.project-photo img
- 프로젝트 이미지가 칸 안에 맞게 들어가도록 합니다.

.project-text
- 프로젝트 이름과 설명이 들어가는 칸입니다.

.tech-page
- 기술 목록 페이지의 배경색을 정합니다.

.tech-box
- 작성할 기술 이름 3개가 들어가는 칸입니다.

.tech-desc
- 작성할 기술 설명 칸입니다.

.tech-name
- HTML5/CSS3 글자에 색상 애니메이션을 적용합니다.

@keyframes colorChange
- 글자색이 파란색, 초록색, 빨간색으로 바뀌는 애니메이션 규칙입니다.

footer
- 페이지 아래쪽 저작권 문구 위치를 정합니다.
-->

<!--
CSS 속성 정리

margin
- 바깥 여백을 정합니다.

padding
- 안쪽 여백을 정합니다.

background-color
- 배경색을 정합니다.

font-family
- 글꼴을 정합니다.

overflow
- 화면 밖으로 넘치는 내용 처리 방법을 정합니다.
- hidden은 스크롤로 페이지가 이어서 보이지 않게 합니다.

display
- 태그가 화면에 보이는 방식을 정합니다.
- none은 숨김, block은 보임, inline-block은 옆으로 배치입니다.

width
- 가로 크기를 정합니다.

height
- 세로 크기를 정합니다.

border
- 테두리 두께, 모양, 색을 정합니다.

position
- 요소 위치 지정 방식을 정합니다.
- relative는 자기 위치 기준, absolute는 부모 기준으로 배치합니다.

bottom
- 아래쪽에서 얼마나 떨어질지 정합니다.

left
- 왼쪽에서 얼마나 떨어질지 정합니다.

text-align
- 글자 가로 정렬을 정합니다.

line-height
- 줄 높이를 정합니다.
- 한 줄 글자를 세로 가운데처럼 보이게 할 때 사용했습니다.

color
- 글자색을 정합니다.

text-decoration
- 링크 밑줄 같은 글자 장식을 정합니다.

font-size
- 글자 크기를 정합니다.

font-weight
- 글자 굵기를 정합니다.

cursor
- 마우스를 올렸을 때 커서 모양을 정합니다.

float
- 요소를 왼쪽이나 오른쪽으로 띄워 배치합니다.

box-shadow
- 박스에 그림자를 넣습니다.

object-fit
- 이미지가 칸 안에 들어가는 방식을 정합니다.
- cover는 꽉 채우기, contain은 전체 이미지가 보이게 맞추기입니다.

vertical-align
- inline-block 요소의 세로 정렬을 정합니다.

box-sizing
- width와 height 계산에 padding, border를 포함할지 정합니다.

animation-name
- 사용할 애니메이션 이름을 정합니다.

animation-duration
- 애니메이션이 한 번 도는 시간을 정합니다.

animation-iteration-count
- 애니메이션 반복 횟수를 정합니다.
- infinite는 무한 반복입니다.
-->
