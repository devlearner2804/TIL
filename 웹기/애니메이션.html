<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    @keyframes TCA{
        0%{color:rgb(194, 9, 24);}
        30%{color:rgb(221, 156, 16);}
        70%{color:rgb(7, 23, 207);}
        100%{color:rgb(194, 9, 24);}
    }
    span{
        animation-name:TCA;
        animation-duration:6s;
        animation-iteration-count:infinite;
    }
</style>
</head>
<body>
    <p style="font-size:24px;">
        <span>여기</span>가 색이 변합니다.</p>
</body>
</html>
