<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     @keyframes TCA{
        0%{color:rgb(194, 9, 24);
        font-size: 100%;}
        50%{color:rgb(7, 23, 207);
         font-size: 500%;}
        100%{color:rgb(194, 9, 24);
         font-size: 100%;}
    }
    span{
        animation-name:TCA;
        animation-duration:0.1s;
        animation-iteration-count:infinite;
    }
    </style>
</head>
<body>
     <p style="font-size:24px;">
        <span>여기</span>가 글이 팽창합니다.</p>
</body>
</html>
