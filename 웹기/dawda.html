<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1980, 그날의 목소리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>

:root {
  --bg: #1a1208;
  --bg2: #221a0e;
  --paper: #f5ede0;
  --paper2: #ede0cc;
  --ink: #2a1f0f;
  --red: #c0392b;
  --red2: #e74c3c;
  --gold: #c9a94a;
  --gold2: #e8c96a;
  --muted: #8a7a65;
  --border: #4a3a25;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--paper);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(192,57,43,.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(201,169,74,.08) 0%, transparent 50%);
  pointer-events: none;
}

header {
  position: relative; z-index: 10;
  background: linear-gradient(135deg, #0d0905 0%, #1a1208 50%, #0d0905 100%);
  border-bottom: 2px solid var(--gold);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 4px 30px rgba(0,0,0,.6);
}

.header-emblem {
  width: 44px; height: 44px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  background: rgba(201,169,74,.08);
}

.header-text h1 {
  font-family: 'Noto Serif KR', serif;
  font-size: 20px;
  font-weight: 900;
  color: var(--gold2);
  letter-spacing: 2px;
  line-height: 1.2;
}

.header-text p {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  margin-top: 2px;
}

#chatbox {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 10px;
  position: relative; z-index: 5;
  scroll-behavior: smooth;
}

#chatbox::-webkit-scrollbar { width: 4px; }
#chatbox::-webkit-scrollbar-track { background: transparent; }
#chatbox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.message {
  max-width: 82%;
  padding: 12px 16px;
  border-radius: 4px;
  margin: 8px 0;
  line-height: 1.7;
  font-size: 14px;
  animation: fadeUp .35s ease both;
  position: relative;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.bot {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  color: var(--paper);
}

.user {
  background: rgba(192,57,43,.18);
  border: 1px solid rgba(192,57,43,.35);
  border-right: 3px solid var(--red);
  margin-left: auto;
  color: var(--paper2);
}

.typing-indicator {
  display: inline-flex; gap: 4px; align-items: center;
  padding: 14px 18px;
}
.typing-indicator span {
  width: 7px; height: 7px;
  background: var(--gold);
  border-radius: 50%;
  animation: blink 1.2s infinite;
}
.typing-indicator span:nth-child(2) { animation-delay: .2s; }
.typing-indicator span:nth-child(3) { animation-delay: .4s; }

@keyframes blink {
  0%,80%,100% { opacity: .2; transform: scale(.8); }
  40% { opacity: 1; transform: scale(1.2); }
}

#bottom-area {
  position: relative; z-index: 10;
  background: linear-gradient(0deg, #0d0905 0%, var(--bg) 100%);
  border-top: 1px solid var(--border);
  padding: 12px 14px 14px;
}

#buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 8px;
}

button {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.04);
  color: var(--paper2);
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .3px;
}

button:hover {
  background: rgba(201,169,74,.15);
  border-color: var(--gold);
  color: var(--gold2);
  transform: translateY(-1px);
}

button.back-btn {
  background: rgba(192,57,43,.12);
  border-color: rgba(192,57,43,.4);
  color: #e88;
  font-size: 12px;
}
button.back-btn:hover {
  background: rgba(192,57,43,.25);
  border-color: var(--red);
  color: #faa;
}

#back-row {
  display: flex;
  justify-content: center;
}

#char-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 4px 0 6px;
}

.char-card {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
}

.char-card:hover {
  background: rgba(201,169,74,.1);
  border-color: var(--gold);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
}

.char-card .emoji { font-size: 22px; margin-bottom: 4px; }

.char-card .name {
  font-family: 'Noto Serif KR', serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--paper);
  line-height: 1.3;
}

.date-stamp {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  margin: 8px 0 14px;
  font-family: 'Noto Serif KR', serif;
}

</style>
</head>
<body>

<header>
  <div class="header-emblem">🕯️</div>
  <div class="header-text">
    <h1>1980, 그날의 목소리</h1>
    <p>5·18 민주화운동 — 여러 시선으로 듣는 역사</p>
  </div>
</header>

<div id="chatbox">
  <div class="date-stamp">1980. 5. 18 — 광주</div>
  <div class="message bot">
    🕯️ 안녕하세요.<br>
    아래 인물 중 누구의 시점으로 이야기를 들어볼까요?<br>
    <span style="font-size:12px;color:var(--muted);">AI가 실제 역사 자료를 바탕으로 응답합니다.</span>
  </div>
</div>

<div id="bottom-area">
  <div id="buttons"></div>
  <div id="back-row"></div>
</div>

<script>
const chatbox = document.getElementById("chatbox");
const buttonsEl = document.getElementById("buttons");
const backRow = document.getElementById("back-row");

let currentMode = "main";
let conversationHistory = [];

const characters = [
  { id:"citizen",    emoji:"👴", name:"광주 시민",        color:"#c9a94a",
    intro:"저는 평범한 광주 시민이었습니다. 그날, 우리 동네 골목도 달라져 있었습니다...",
    system:`당신은 1980년 5월 광주의 평범한 40대 시민입니다. 가족이 있고 작은 가게를 운영합니다. 5·18 민주화운동 당시 계엄군의 진압을 목격하고 시민들과 함께 저항에 동참했습니다. 1인칭 시점으로, 실제 역사적 사실을 바탕으로 감정과 경험을 생생하게 이야기해주세요. 역사적 사실과 다른 내용은 말하지 마세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"bereaved",   emoji:"👩‍🦳", name:"유가족",           color:"#e74c3c",
    intro:"제 아들이 그날 나갔다가... 다시는 돌아오지 못했습니다.",
    system:`당신은 5·18 민주화운동에서 자녀를 잃은 유가족입니다. 깊은 슬픔과 함께 진실 규명을 위해 오랫동안 싸워온 어머니입니다. 1인칭 시점으로, 실제 역사적 사실과 유가족들의 증언을 바탕으로 감정을 절제하면서도 진솔하게 이야기해주세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"taxi",       emoji:"🚕", name:"택시기사",          color:"#e67e22",
    intro:"그날 외국 기자 손님을 태우고 광주로 향했습니다. 그게 제 인생을 바꿔놨죠...",
    system:`당신은 1980년 5월 광주 항쟁 당시 외국 기자를 태우고 광주로 들어간 택시기사입니다. 영화 '택시운전사'의 실제 모델 김사복씨를 참고하되, 역사적 사실에 충실하게 1인칭으로 이야기해주세요. 직접 목격한 장면과 감정을 생생하게 표현하세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"reporter",   emoji:"📷", name:"외국인 기자",       color:"#3498db",
    intro:"I came to cover the story that the world had to see.",
    system:`당신은 1980년 5월 광주를 취재한 외국인 기자입니다. 실제로 위르겐 힌츠페터(독일 ARD 기자)가 광주 항쟁을 취재했습니다. 1인칭 시점으로, 외부인의 눈으로 광주에서 목격한 것을 이야기해주세요. 역사적 사실에 기반해서, 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"student",    emoji:"🎓", name:"대학생 항쟁 참여자", color:"#27ae60",
    intro:"민주주의를 외치며 거리로 나갔습니다. 두렵지 않았다면 거짓말이겠지요.",
    system:`당신은 1980년 5월 광주에서 민주화 시위에 참여한 전남대학교 20대 대학생입니다. 계엄 확대에 분노하며 시위에 나섰고, 계엄군의 폭력을 목격했습니다. 1인칭 시점으로 당시 긴장감, 공포, 연대감을 역사적 사실에 맞게 생생히 표현해주세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"nurse",      emoji:"🏥", name:"간호사",            color:"#e91e63",
    intro:"총상을 입은 사람들이 쉬지 않고 실려 왔습니다. 저는 그저 손을 놓을 수가 없었어요.",
    system:`당신은 1980년 5월 광주 항쟁 당시 전남대병원이나 적십자병원에서 일한 간호사입니다. 부상자들을 치료하며 의료 현장에서 겪은 일들을 1인칭으로 이야기해주세요. 혼란스럽고 긴박했던 의료 현장의 실상과 감정을 역사적 사실에 맞게 전해주세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"militia",    emoji:"⚡", name:"시민군 참여자",      color:"#f39c12",
    intro:"총을 든 건 처음이었습니다. 하지만 물러설 수 없었어요.",
    system:`당신은 5·18 민주화운동 당시 시민군에 자원한 20~30대 광주 시민입니다. 계엄군의 학살에 맞서 총기를 들고 도청을 지킨 시민군의 한 명입니다. 1인칭 시점으로, 5·18 역사 자료와 증언을 바탕으로 당시 각오와 상황을 생생하게 표현해주세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"yoon",       emoji:"✊", name:"윤상원의 동료",      color:"#9b59b6",
    intro:"상원이는 마지막까지 도청을 지켰습니다. 우리는 그와 함께였습니다.",
    system:`당신은 5·18 당시 도청에서 끝까지 항쟁을 이끌었던 윤상원의 동료입니다. 윤상원은 들불야학의 지도자이자 5·18 최후 항쟁을 이끈 실존 인물입니다. 그와 함께한 기억과 5·27 도청 최후 항전의 상황을 1인칭 시점으로, 역사적 사실에 기반해 이야기해주세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"shopkeeper", emoji:"🏪", name:"금남로 상인",        color:"#1abc9c",
    intro:"가게 문을 열어야 할지, 닫아야 할지... 거리 상황이 시시각각 달라졌습니다.",
    system:`당신은 1980년 5월 광주 금남로에서 가게를 운영하던 상인입니다. 시위와 진압이 벌어지는 한복판에서 가게를 지켜야 했던 상황, 시민들과의 연대, 목격한 장면들을 1인칭으로 이야기해주세요. 역사적 사실에 맞게 당시의 일상과 공포를 전해주세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"passerby",   emoji:"🚶", name:"지나가던 시민",      color:"#95a5a6",
    intro:"저는 그냥 시장에 가던 중이었습니다. 그런데 갑자기...",
    system:`당신은 1980년 5월 광주 시내에서 우연히 시위 현장을 목격한 평범한 시민입니다. 정치적 의도 없이 일상을 보내다가 계엄군의 진압과 시민들의 저항을 우연히 목격하게 됐습니다. 혼란스럽고 무서웠던 그날의 기억을 1인칭으로, 역사적 사실에 맞게 이야기해주세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"soldier",    emoji:"🪖", name:"공수부대원",         color:"#7f8c8d",
    intro:"명령을 받았습니다. 하지만 내가 본 것이... 그것이 옳은 것이었는지.",
    system:`당신은 1980년 5월 광주에 투입된 공수부대원입니다. 당신은 훗날 자신의 행동에 양심의 가책을 느끼며 증언한 군인입니다. 1인칭 시점으로, 당시 받은 명령과 실제로 목격하고 행한 일들, 그리고 그에 대한 내면의 갈등을 역사적 사실에 맞게 솔직하게 이야기해주세요. 한국어로, 3~5문장으로 답해주세요.`
  },
  { id:"history",    emoji:"📚", name:"역사적 설명",        color:"#bdc3c7",
    intro:"5·18 민주화운동의 역사적 사실과 의미를 객관적으로 설명해 드립니다.",
    system:`당신은 5·18 민주화운동 전문 역사학자입니다. 객관적이고 학술적인 시각으로 5·18의 원인, 전개 과정, 역사적 의의, 현재적 의미를 설명해주세요. 확인된 역사적 사실만을 바탕으로, 쉽고 명확하게 설명해주세요. 한국어로, 4~6문장으로 답해주세요.`
  },
];

function showMain() {
  currentMode = "main";
  conversationHistory = [];
  backRow.innerHTML = "";
  buttonsEl.innerHTML = "";
  const grid = document.createElement("div");
  grid.id = "char-grid";
  characters.forEach(ch => {
    const card = document.createElement("div");
    card.className = "char-card";
    card.innerHTML = `<div class="emoji">${ch.emoji}</div><div class="name">${ch.name}</div>`;
    card.onclick = () => selectCharacter(ch);
    grid.appendChild(card);
  });
  buttonsEl.appendChild(grid);
}

function selectCharacter(ch) {
  currentMode = ch.id;
  conversationHistory = [];
  addMessage(`${ch.emoji} ${ch.name} 시점을 선택했습니다.`, "user");
  showTyping().then(() => {
    addMessage(
      `<strong style="color:var(--gold2)">${ch.emoji} ${ch.name}</strong><br><br>"${ch.intro}"`,
      "bot"
    );
    showQButtons(ch);
    showBackButton();
  });
}

function showQButtons(ch) {
  buttonsEl.innerHTML = "";
  const qs = getSuggestedQuestions(ch.id);
  qs.forEach(q => {
    const btn = document.createElement("button");
    btn.innerText = q;
    btn.onclick = () => askAI(ch, q);
    buttonsEl.appendChild(btn);
  });
  const customBtn = document.createElement("button");
  customBtn.innerText = "💬 직접 질문하기";
  customBtn.onclick = () => openCustomInput(ch);
  buttonsEl.appendChild(customBtn);
}

function showBackButton() {
  backRow.innerHTML = "";
  const btn = document.createElement("button");
  btn.className = "back-btn";
  btn.innerHTML = "← 처음으로 돌아가기";
  btn.onclick = () => {
    addMessage("← 처음으로 돌아갑니다", "user");
    setTimeout(() => {
      addMessage("🕯️ 누구의 이야기를 더 들어볼까요?", "bot");
      showMain();
    }, 300);
  };
  backRow.appendChild(btn);
}

function getSuggestedQuestions(id) {
  const qs = {
    citizen:    ["그날 아침 분위기는 어땠나요?", "왜 거리로 나오게 됐나요?", "가장 기억에 남는 순간은?", "시민들끼리 어떻게 도왔나요?"],
    bereaved:   ["아들이 마지막으로 나간 날은?", "진실 규명을 위해 어떻게 싸웠나요?", "지금도 기억하시나요?", "국가에 바라는 것은?"],
    taxi:       ["왜 광주로 향했나요?", "외국 기자와 무슨 이야기를 했나요?", "도로 봉쇄는 어떻게 뚫었나요?", "가장 충격적인 장면은?"],
    reporter:   ["어떻게 광주에 들어갈 수 있었나요?", "세계에 무엇을 전하고 싶었나요?", "현장에서 가장 위험했던 순간은?", "지금 돌이켜보면?"],
    student:    ["처음 시위에 나간 이유는?", "계엄군을 마주쳤을 때 기분은?", "함께한 동료들은 어땠나요?", "민주주의란 무엇이라 생각했나요?"],
    nurse:      ["병원 상황은 어땠나요?", "가장 힘들었던 순간은?", "혈액이나 약품은 어떻게 구했나요?", "부상자들은 무슨 말을 했나요?"],
    militia:    ["시민군에 자원한 이유는?", "총기는 어디서 구했나요?", "도청에서의 마지막 밤은?", "두렵지 않았나요?"],
    yoon:       ["윤상원은 어떤 사람이었나요?", "들불야학은 어떤 곳이었나요?", "마지막을 각오했을 때 심경은?", "그의 유언은 무엇이었나요?"],
    shopkeeper: ["가게를 열었나요, 닫았나요?", "계엄군이 지나갈 때는?", "주변 상인들은 어떻게 했나요?", "가장 무서웠던 순간은?"],
    passerby:   ["갑자기 무슨 일이 벌어졌나요?", "당신은 어떻게 했나요?", "주변 사람들 반응은?", "그 후 어떻게 됐나요?"],
    soldier:    ["광주에 투입된다는 걸 알았을 때?", "시민들에게 어떤 명령을 받았나요?", "지금 그 행동을 어떻게 생각하나요?", "당신은 진실을 말할 수 있나요?"],

  };
  return qs[id] || ["더 이야기해주세요."];
}

async function askAI(ch, question) {
  addMessage(`💬 ${question}`, "user");
  buttonsEl.querySelectorAll("button").forEach(b => b.disabled = true);
  const typingEl = showTypingEl();
  conversationHistory.push({ role: "user", content: question });

  try {
    const trimmed = conversationHistory.slice(-10);
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: ch.system,
        messages: trimmed
      })
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({}));
      throw new Error(err?.error?.message || `HTTP ${response.status}`);
    }

    const data = await response.json();
    const text = data.content?.[0]?.text || "죄송합니다, 응답을 받지 못했습니다.";
    conversationHistory.push({ role: "assistant", content: text });
    typingEl.remove();
    addMessage(`${ch.emoji} ${text}`, "bot");
    showQButtons(ch);

  } catch (err) {
    conversationHistory.pop();
    typingEl.remove();
    addMessage(`⚠️ 오류: ${err.message || "응답을 받지 못했습니다. 잠시 후 다시 시도해주세요."}`, "bot");
    showQButtons(ch);
    console.error(err);
  }
}

function openCustomInput(ch) {
  buttonsEl.innerHTML = "";
  const wrapper = document.createElement("div");
  wrapper.style.cssText = "display:flex;gap:8px;width:100%;";
  const inp = document.createElement("input");
  inp.type = "text";
  inp.placeholder = "질문을 입력하세요...";
  inp.style.cssText = `flex:1;padding:9px 14px;border-radius:20px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:var(--paper);font-family:'Noto Sans KR',sans-serif;font-size:14px;outline:none;`;
  const sendBtn = document.createElement("button");
  sendBtn.innerText = "전송";
  sendBtn.style.cssText = "background:var(--gold);color:#0d0905;font-weight:700;border:none;";
  const send = () => {
    const q = inp.value.trim();
    if (!q) return;
    inp.value = "";
    buttonsEl.innerHTML = "";
    askAI(ch, q).then(() => showQButtons(ch));
  };
  sendBtn.onclick = send;
  inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  wrapper.appendChild(inp);
  wrapper.appendChild(sendBtn);
  buttonsEl.appendChild(wrapper);
  setTimeout(() => inp.focus(), 100);
}

function addMessage(html, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerHTML = html;
  chatbox.appendChild(div);
  chatbox.scrollTop = chatbox.scrollHeight;
  return div;
}

function showTypingEl() {
  const div = document.createElement("div");
  div.className = "message bot";
  div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;
  chatbox.appendChild(div);
  chatbox.scrollTop = chatbox.scrollHeight;
  return div;
}

function showTyping(ms = 600) {
  const el = showTypingEl();
  return new Promise(r => setTimeout(() => { el.remove(); r(); }, ms));
}

showMain();
