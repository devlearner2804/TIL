<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     span{
        transition: all 1.5s;
    }
    span:hover{
        font-size:300%;
        color:blue;
    }
    input{
        background: violet;
         transition: 0.1s;
    }
    input:hover{
        font-size:200%;
        color:green;
    }
    input:focus{
        font-size:500%;
        color:blue;
        background:pink;
    }
    </style>
</head>
<body>
<input type="text" placeholder="나댐이"><br>
</body>
</html>
