<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    div{
        display : inline-block;
        padding: 5px;
        color : white;
        background: olive;
    }
    #rotate:hover{
        transform : rotate(-30deg);
        
    }
    #skew{
        transform : skew(30deg,30deg);
    } 
    #translate:hover{
        transform : translate(40px,80px);
    }
    #scale{
        transform : scale(2,2.5);
    }
</style>
</head>
<body>
    <br><br><br><br><br><br>
<div id="rotate">
    30도만큼 회전
</div>
<div id="skew">
    x축30 y축30만큼
</div>
<div id="translate">
    x축40 y축80만큼 이동
</div>
<div id="scale">
    가로2배 세로2.5배
</div>
</body>
</html>
