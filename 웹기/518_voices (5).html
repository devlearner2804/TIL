<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1980, 그날의 목소리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1208;
  --bg2: #221a0e;
  --paper: #f5ede0;
  --paper2: #ede0cc;
  --gold: #c9a94a;
  --gold2: #e8c96a;
  --red: #c0392b;
  --muted: #8a7a65;
  --border: #4a3a25;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--paper);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(192,57,43,.15) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(201,169,74,.08) 0%, transparent 50%);
  pointer-events: none;
}
header {
  position: relative; z-index: 10;
  background: linear-gradient(135deg, #0d0905 0%, #1a1208 50%, #0d0905 100%);
  border-bottom: 2px solid var(--gold);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: 0 4px 30px rgba(0,0,0,.6);
}
.header-emblem {
  width: 44px; height: 44px;
  border: 2px solid var(--gold);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  background: rgba(201,169,74,.08);
}
.header-text h1 {
  font-family: 'Noto Serif KR', serif;
  font-size: 20px;
  font-weight: 900;
  color: var(--gold2);
  letter-spacing: 2px;
  line-height: 1.2;
}
.header-text p {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  margin-top: 2px;
}
#chatbox {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 10px;
  position: relative; z-index: 5;
  scroll-behavior: smooth;
}
#chatbox::-webkit-scrollbar { width: 4px; }
#chatbox::-webkit-scrollbar-track { background: transparent; }
#chatbox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.message {
  max-width: 82%;
  padding: 14px 18px;
  border-radius: 4px;
  margin: 8px 0;
  line-height: 1.9;
  font-size: 14px;
  animation: fadeUp .35s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.bot {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  color: var(--paper);
}
.user {
  background: rgba(192,57,43,.18);
  border: 1px solid rgba(192,57,43,.35);
  border-right: 3px solid var(--red);
  margin-left: auto;
  color: var(--paper2);
}
#bottom-area {
  position: relative; z-index: 10;
  background: linear-gradient(0deg, #0d0905 0%, var(--bg) 100%);
  border-top: 1px solid var(--border);
  padding: 12px 14px 14px;
}
#buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 8px;
}
button {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.04);
  color: var(--paper2);
  padding: 8px 14px;
  border-radius: 20px;
  cursor: pointer;
  transition: all .2s;
}
button:hover {
  background: rgba(201,169,74,.15);
  border-color: var(--gold);
  color: var(--gold2);
  transform: translateY(-1px);
}
button.back-btn {
  background: rgba(192,57,43,.12);
  border-color: rgba(192,57,43,.4);
  color: #e88;
  font-size: 12px;
}
button.back-btn:hover {
  background: rgba(192,57,43,.25);
  border-color: var(--red);
  color: #faa;
}
#back-row { display: flex; justify-content: center; }
#char-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 4px 0 6px;
}
.char-card {
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 6px;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
}
.char-card:hover {
  background: rgba(201,169,74,.1);
  border-color: var(--gold);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,.4);
}
.char-card .emoji { font-size: 22px; margin-bottom: 4px; }
.char-card .name {
  font-family: 'Noto Serif KR', serif;
  font-size: 12px;
  font-weight: 600;
  color: var(--paper);
  line-height: 1.3;
}
.date-stamp {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 2px;
  margin: 8px 0 14px;
  font-family: 'Noto Serif KR', serif;
}
</style>
</head>
<body>

<header>
  <div class="header-emblem">🕯️</div>
  <div class="header-text">
    <h1>1980, 그날의 목소리</h1>
    <p>5·18 민주화운동 — 여러 시선으로 듣는 역사</p>

</div>

<div id="bottom-area">
  <div id="buttons"></div>
  <div id="back-row"></div>
</div>

      "하지만 현장에서 마주친 건 폭도가 아니었습니다. 맨손의 학생들, 울고 있는 아주머니들, 도망치는 노인들이었습니다. 명령은 강경 진압이었고, 저는 군인이었습니다. 그 순간 제가 할 수 있는 건 없었습니다.",
      "제대하고 나서도 오랫동안 그 기억을 묻어두고 살았습니다. 누군가 광주 얘기를 꺼내면 자리를 피했습니다. 수십 년이 지난 지금, 저는 그때 제가 본 것을 말해야 한다고 생각합니다. 그곳에 있었던 시민들은 폭도가 아니었습니다."
    ]
  },
  {
    emoji:"📚", name:"역사적 설명",
    story:[
      "5·18 민주화운동은 1980년 5월 18일부터 27일까지 광주에서 일어난 민주화 항쟁입니다. 전두환을 중심으로 한 신군부가 1979년 12·12 쿠데타로 권력을 장악한 뒤, 1980년 5월 17일 비상계엄을 전국으로 확대하면서 촉발되었습니다.",
      "계엄군은 시위대를 무력으로 진압했고, 시민들은 이에 맞서 저항했습니다. 시민군이 자발적으로 조직되었고, 5월 21일에는 계엄군이 집단 발포를 하여 수많은 시민이 희생되었습니다. 5월 27일 새벽 계엄군의 최종 진압으로 열흘간의 항쟁은 막을 내렸습니다.",
      "공식 사망자는 165명, 행방불명 65명, 부상자 3,000여 명으로 기록되어 있으나 실제 피해는 더 클 것으로 추정됩니다. 5·18은 1997년 국가기념일로 지정되었고, 관련 기록물은 2011년 유네스코 세계기록유산으로 등재되었습니다."
    ]
  },
];

function addMessage(html, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerHTML = html;
  chatboxEl.appendChild(div);
  chatboxEl.scrollTop = chatboxEl.scrollHeight;
}

function showMain() {
  backRow.innerHTML = "";
  buttonsEl.innerHTML = "";

  const grid = document.createElement("div");
  grid.id = "char-grid";

  characters.forEach(ch => {
    const card = document.createElement("div");
    card.className = "char-card";
    card.innerHTML = `<div class="emoji">${ch.emoji}</div><div class="name">${ch.name}</div>`;
    card.onclick = () => selectCharacter(ch);
    grid.appendChild(card);
  });

  buttonsEl.appendChild(grid);
}

function selectCharacter(ch) {
  addMessage(`${ch.emoji} ${ch.name} 시점을 선택했습니다.`, "user");

  setTimeout(() => {
    const paragraphs = ch.story
      .map(p => `<p style="margin-bottom:12px">${p}</p>`)
      .join("");

    addMessage(
      `<strong style="color:var(--gold2);font-family:'Noto Serif KR',serif;font-size:15px;">${ch.emoji} ${ch.name}</strong><br><br>` + paragraphs,
      "bot"
    );

    buttonsEl.innerHTML = "";
    backRow.innerHTML = "";

    const btn = document.createElement("button");
    btn.className = "back-btn";
    btn.innerHTML = "← 처음으로 돌아가기";
    btn.onclick = () => {
      addMessage("← 처음으로 돌아갑니다", "user");
      setTimeout(() => {
        addMessage("🕯️ 누구의 이야기를 더 들어볼까요?", "bot");
        showMain();
      }, 300);
    };
    backRow.appendChild(btn);
  }, 400);
}

showMain();
</script>
</body>
</html>
