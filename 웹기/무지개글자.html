<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>무지개 글자 예제</title>
    <style>
        body {
            font-family: "맑은 고딕", Arial, sans-serif;
            margin: 30px;
            background: #172033;
        }

        @keyframes rainbow {
            0% { color: red; }
            20% { color: orange; }
            40% { color: yellow; }
            60% { color: green; }
            80% { color: blue; }
            100% { color: purple; }
        }

        h1 {
            font-size: 44px;
            animation: rainbow 5s infinite;
        }
    </style>
</head>
<body>
    <h1>무지개 글자 애니메이션</h1>
</body>
</html>
